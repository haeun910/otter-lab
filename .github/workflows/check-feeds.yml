# 소식 출처 점검: 출처마다 실제로 받아지는지 확인해요 (Actions 탭에서 "Run workflow")
name: 소식 출처 점검

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run feeds:check
        env:
          GITHUB_TOKEN: ${{ github.token }}
